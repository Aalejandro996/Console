<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --surface-2:#1D1D1D;
    --surface-3:#272727;
    --border:#333333;
    --text:#F2F2F2;
    --text-dim:#A3A3A3;
    --text-faint:#6E6E6E;
    --accent:#F2F2F2;
    --accent-dark:#CFCFCF;
    --accent-soft:rgba(242,242,242,.10);
    --mint:#3DDC84;
    --mint-soft:rgba(61,220,132,.14);
    --rose:#FF5C5C;
    --rose-soft:rgba(255,92,92,.14);
    --blue:#7C9CFF;
    --green:#4ADE80;
    --pink:#FF6E97;
    --purple:#B79CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:22px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:17px;
    padding:0 8px 22px 8px;
    line-height:1.25;
    color:var(--text);
    display:flex;align-items:center;gap:10px;
  }
  .brand img{width:38px;height:38px;border-radius:9px;flex-shrink:0;box-shadow:0 0 14px rgba(242,242,242,.18);}
  .brand .txt{display:flex;flex-direction:column;}
  .brand .txt small{font-size:10.5px;font-weight:600;color:var(--text-faint);letter-spacing:.5px;}
  .brand span{color:var(--accent);}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    color:var(--text-dim);font-weight:500;font-size:13.5px;
    cursor:pointer;margin-bottom:4px;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex-shrink:0;}
  .sidebar-foot{margin-top:auto;padding:10px 8px 0 8px;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);padding-top:14px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:24px 30px 60px 30px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
  .rate-pill{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;font-size:13px;
  }
  .rate-pill .lbl{color:var(--text-dim);}
  .rate-pill .val{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .rate-pill button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;
  }
  .rate-pill button:hover{color:var(--text);border-color:var(--accent);}
  .rate-pill .updated{color:var(--text-faint);font-size:11px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .stations-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:16px;
  }
  .btn{
    border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:filter .12s, transform .05s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#101010;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--text-faint);}
  .btn-danger{background:var(--rose-soft);color:var(--rose);}
  .btn-danger:hover{filter:brightness(1.15);}
  .btn-mint{background:var(--mint-soft);color:var(--mint);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* station card */
  .station-card{position:relative;overflow:hidden;}
  .station-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .station-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .station-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .console-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:100px;margin-top:4px;
  }
  .status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.2px;}
  .status-badge.free{background:var(--mint-soft);color:var(--mint);}
  .status-badge.busy{background:var(--rose-soft);color:var(--rose);}
  .timer{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;
    font-variant-numeric:tabular-nums;margin:10px 0 2px 0;
  }
  .timer.over{color:var(--rose);}
  .timer-sub{color:var(--text-dim);font-size:12px;margin-bottom:12px;}
  .station-cost{font-size:13px;color:var(--text-dim);margin-bottom:12px;}
  .station-cost b{color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .station-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .station-actions .btn{flex:1;min-width:80px;}
  .icon-x{
    background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:2px 4px;
    border-radius:6px;line-height:1;
  }
  .icon-x:hover{color:var(--rose);background:var(--surface-2);}

  .empty{
    border:1.5px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--text-faint);
  }
  .empty .btn{margin-top:12px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(9,7,14,.62);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:380px;padding:20px;max-height:86vh;overflow-y:auto;
  }
  .modal.wide{max-width:460px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
  .field input, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .field .hint{font-size:11px;color:var(--text-faint);margin-top:5px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:52px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .seg button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .paytabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface-2);padding:4px;border-radius:10px;}
  .paytabs button{
    flex:1;border:none;background:transparent;color:var(--text-dim);padding:8px 4px;border-radius:7px;
    font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .paytabs button.active{background:var(--surface-3);color:var(--accent);}
  .summary-box{
    background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;
  }
  .summary-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-dim);}
  .summary-row b{color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .summary-total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:15px;}
  .summary-total b{color:var(--accent);font-size:17px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .close-x{background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;}

  /* ---------- Dashboard ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{padding:18px;}
  .kpi .lbl{color:var(--text-dim);font-size:12px;margin-bottom:8px;}
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .kpi .val.usd{color:var(--accent);}
  .kpi .val.bs{color:var(--mint);}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;margin:26px 0 12px 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:none;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--surface-2);color:var(--text-dim);}
  td.strong{color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:600;}
  tr:last-child td{border-bottom:none;}
  .bar-track{background:var(--surface-2);border-radius:5px;height:8px;width:100%;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .filter-toggle{display:flex;gap:6px;}
  .filter-toggle button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .filter-toggle button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* config */
  .cfg-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin-bottom:8px;}
  .cfg-row .name{flex:1;font-weight:600;}
  .cfg-row input{width:90px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 8px;font-size:13px;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--surface-3);border:1px solid var(--border);
    color:var(--text);padding:12px 16px;border-radius:10px;font-size:13px;z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    max-width:320px;
  }
  .toast.err{border-color:var(--rose);color:var(--rose);}
  .muted{color:var(--text-faint);font-size:12px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media print{
    body *{visibility:hidden;}
    #print-invoice, #print-invoice *{visibility:visible;color:#000!important;}
    #print-invoice{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff;}
    #print-invoice table{width:100%;}
    #print-invoice th, #print-invoice td{border-bottom:1px solid #ccc;padding:6px;}
  }

  @media (max-width:720px){
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:100%;
      flex-direction:row;justify-content:space-around;padding:8px;border-right:none;border-top:1px solid var(--border);z-index:50;}
    .brand,.sidebar-foot{display:none;}
    .nav-item{flex-direction:column;font-size:10px;gap:3px;padding:6px 8px;}
    .main{padding:16px 14px 90px 14px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/app.js"></script>
</body>
